name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install toolchain and GTK
        run: dnf install -y git gcc pkgconf-pkg-config gtk4-devel libadwaita-devel rust cargo clippy rustfmt

      - uses: actions/checkout@v7

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: quality-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy (release)
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Clippy (smoke)
        run: cargo clippy --workspace --all-targets --features cadmium-app/smoke -- -D warnings

      - name: File sizes
        run: .github/check-file-sizes.sh

  test:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    env:
      # No GPU on the runner: run the GPU tests on lavapipe, Mesa's software Vulkan.
      CADMIUM_SOFTWARE_GPU: "1"
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - name: Install toolchain, GTK, lavapipe and Xvfb
        run: dnf install -y git gcc pkgconf-pkg-config gtk4-devel libadwaita-devel rust cargo mesa-vulkan-drivers xorg-x11-server-Xvfb

      - uses: actions/checkout@v7

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: test-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: xvfb-run -a cargo test --workspace --release --locked --features cadmium-app/smoke
