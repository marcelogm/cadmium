name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install toolchain and GTK
        run: dnf install -y git gcc pkgconf-pkg-config gtk4-devel libadwaita-devel rust cargo clippy rustfmt python3 desktop-file-utils appstream

      - uses: actions/checkout@v7

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: quality-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy (release)
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Clippy (smoke)
        run: cargo clippy --workspace --all-targets --features cadmium-app/smoke -- -D warnings

      - name: File sizes
        run: .github/check-file-sizes.sh

      - name: Flatpak cargo sources match Cargo.lock
        run: python3 packaging/flatpak/cargo-sources.py Cargo.lock | diff -u packaging/flatpak/cargo-sources.json -

      - name: Desktop entry and metainfo
        run: |
          desktop-file-validate crates/cadmium-app/data/io.github.marcelogm.Cadmium.desktop
          appstreamcli validate --no-net crates/cadmium-app/data/io.github.marcelogm.Cadmium.metainfo.xml

  test:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    permissions:
      contents: write
    env:
      # No GPU on the runner: run the GPU tests on lavapipe, Mesa's software Vulkan.
      CADMIUM_SOFTWARE_GPU: "1"
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      # Fedora's rustc is built on the system LLVM, so coverage uses its tools.
      LLVM_COV: /usr/bin/llvm-cov
      LLVM_PROFDATA: /usr/bin/llvm-profdata
    steps:
      - name: Install toolchain, GTK, lavapipe, Xvfb and LLVM
        run: dnf install -y git gcc pkgconf-pkg-config gtk4-devel libadwaita-devel rust cargo mesa-vulkan-drivers xorg-x11-server-Xvfb llvm python3 tar

      - uses: actions/checkout@v7

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: test-cargo-${{ hashFiles('Cargo.lock') }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Widget building, signal wiring, GObject subclasses and the code that needs a display, a GPU or real dmabufs only run in the smoke test; leave them out of the metric.
      - name: Test with coverage
        run: xvfb-run -a cargo llvm-cov --workspace --release --locked --features cadmium-app/smoke --ignore-filename-regex '/cadmium-app/src/(.+/)?(signals|build|wiring|layout|header|imp)\.rs$|/cadmium-app/src/(application|dmabuf_selftest|smoke)\.rs$|/cadmium-app/src/(dmabuf/(export|pool|sync)|dmabuf_selftest/run)\.rs$|/cadmium-app/src/presenter/by_(dmabuf|readback)\.rs$' --json --summary-only --output-path coverage.json

      - name: Coverage summary
        run: python3 .github/coverage-badge.py coverage.json badge/coverage.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: badge
        run: |
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "coverage badge"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
