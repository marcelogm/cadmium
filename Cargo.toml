[workspace]
resolver = "3"
members = ["crates/cadmium-engine", "crates/cadmium-app"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.1.0"

[workspace.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
wgpu-hal = { version = "30.0.1", features = ["vulkan"] }
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
png = "0.17"
libc = "0.2"
drm-fourcc = "2.2"
async-channel = "2"
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
glib-build-tools = "0.22"
